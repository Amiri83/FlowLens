[project]
name = "flowlens"
version = "0.1.0"
description = "Local-first DevOps infrastructure visualization & troubleshooting tool (Terraform + AWS, no AI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "boto3>=1.34",
    "typer>=0.12",
    "python-hcl2>=4.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "moto>=5.0",
    "httpx>=0.27",
]

[project.scripts]
flowlens = "flowlens.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowlens = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
